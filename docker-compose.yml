name: n8n

services:
  postgres:
    image: postgres:16.14-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${GENERIC_TIMEZONE:-Europe/Kyiv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  n8n:
    image: n8nio/n8n:2.35.2
    container_name: n8n-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}

      N8N_HOST: ${N8N_HOST:?Set N8N_HOST in .env}
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:?Set WEBHOOK_URL in .env}
      N8N_PROXY_HOPS: 1
      # Allows login via http://localhost:5678. Remove if you only use ngrok.
      N8N_SECURE_COOKIE: 'false'
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Kyiv}
      TZ: ${GENERIC_TIMEZONE:-Europe/Kyiv}

      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 336
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000

      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_RUNNERS_TASK_TIMEOUT: 300
      N8N_UNVERIFIED_PACKAGES_ENABLED: 'false'

      # Defaults for these limits will drop in future versions — pin them explicitly.
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 2147483648
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 5000
    ports:
      - '127.0.0.1:5678:5678'
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:5678/healthz'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  ngrok:
    image: ngrok/ngrok:3-alpine
    container_name: n8n-ngrok
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    command: http n8n:5678 --url=${NGROK_DOMAIN:?Set NGROK_DOMAIN in .env}
    ports:
      - '127.0.0.1:4040:4040'
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: n8n-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_EXTRA_OPTS: '-Z6'
      SCHEDULE: ${BACKUP_SCHEDULE:-@weekly}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-0}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-0}
      TZ: ${GENERIC_TIMEZONE:-Europe/Kyiv}
    volumes:
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
  n8n_data:
